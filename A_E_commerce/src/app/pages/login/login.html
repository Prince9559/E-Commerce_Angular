<div class="login-container">
  <div class="left-section">
    <div class="logo-box">
      <img src="pic/on.jpg" alt="Logo" />
      <h1>Shopping Store</h1>
    </div>
  </div>

  <div class="right-section">
    <div class="form-box">
      <h2>LOGIN</h2>

      <div class="input-box">
        <input type="email" placeholder="Email / Username" [(ngModel)]="email"name="email"/>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Password" [(ngModel)]="password"name="password"/>
      </div>

      <button (click)="login()">LOGIN →</button>

      <p class="powered">Powered By:</p>
      <img src="pic/super.jpg" class="small-logo" />
    </div>
  </div>
</div>

<h2 style="text-align:center; margin:20px 0;">
   Fashion Categories
</h2>

<div class="product-container">

  <div class="product-card" *ngFor="let item of products">

    <div class="img-box">
      <img
        [src]="item.image"
        [alt]="item.name"
      />
    </div>

    <div class="content">
      <h3>{{ item.name }}</h3>

      <p class="desc">
        {{ item.description }}
      </p>

      <div class="price-section">
        <span class="new-price">₹{{ item.new_price }}</span>
        <span class="old-price">₹{{ item.old_price }}</span>
      </div>
    </div>

  </div>

</div>

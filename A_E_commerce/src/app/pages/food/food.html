<h2 style="text-align:center; margin:20px 0;">
   Food Categories
</h2>

<div class="food-container">

    <div class="food-card" *ngFor="let item of products" [routerLink]="['/product','food',item.id]">

    <div class="food-img-box">
      <img [src]="item.image" [alt]="item.name">
    </div>

    <div class="food-content">

      <h3>{{ item.name }}</h3>

      <p class="food-desc">
        {{ item.description }}
      </p>

      <div class="food-price-section">

        <span class="food-new-price">
          ₹{{ item.new_price }}
        </span>

        <span class="food-old-price">
          ₹{{ item.old_price }}
        </span>

      </div>

    </div>

  </div>

</div>

<h2 style="text-align:center; margin:20px 0;">
   Beauty Categories
</h2>

<div class="beauty-container">

    <div class="beauty-card" *ngFor="let item of products" [routerLink]="['/product','beauty',item.id]">
    <div class="beauty-img-box">
      <img [src]="item.image" [alt]="item.name">
    </div>

    <div class="beauty-content">
      <h3>{{ item.name }}</h3>

      <p class="beauty-desc">
        {{ item.description }}
      </p>

      <div class="beauty-price-section">
        <span class="beauty-new-price">
          ₹{{ item.new_price }}
        </span>

        <span class="beauty-old-price">
          ₹{{ item.old_price }}
        </span>

      </div>

    </div>

  </div>

</div>

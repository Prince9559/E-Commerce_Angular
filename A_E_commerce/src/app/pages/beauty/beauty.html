<h2 style="text-align:center; margin:20px 0;">
   Beauty Categories
</h2>

<div class="mobile-container">

  <div class="mobile-card" *ngFor="let item of products">

    <div class="mobile-img-box">
      <img [src]="item.image" [alt]="item.name">
    </div>

    <div class="mobile-content">

      <h3>{{ item.name }}</h3>

      <p class="mobile-desc">
        {{ item.description }}
      </p>

      <div class="mobile-price-section">

        <span class="mobile-new-price">
          ₹{{ item.new_price }}
        </span>

        <span class="mobile-old-price">
          ₹{{ item.old_price }}
        </span>

      </div>

    </div>

  </div>

</div>

      <img src="assets/banner7.jpg" class="d-block w-100" alt="Banner 1">

      <div class="carousel-item">

          data-bs-target="#homeCarousel"
          data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>

  <button class="carousel-control-next" type="button"
          data-bs-target="#homeCarousel"
          data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>

</div>

<div class="slider-container">
  <h2 class="title">Prince, still looking for these?</h2>

  <button class="arrow left" (click)="scrollLeft()">
    &#10094;
  </button>

  <div class="slider" #slider>

    <div class="slider-card" *ngFor="let item of products">
      <img [src]="item.image" [alt]="item.name">
      <p class="slider-name">{{ item.name }}</p>
    </div>

  </div>

  <button class="arrow right" (click)="scrollRight()">
    &#10095;
  </button>

</div>

<div class="top-selection">
  <h2>Top Selection</h2>

  <div class="selection-wrapper">

    <div class="selection-card" *ngFor="let item of showProducts">
      <img [src]="item.image" [alt]="item.name">

      <div class="card-content">
        <p>{{ item.name }}</p>
        <b>{{ item.description }}</b>
        <h4>{{ item.tag }}</h4>
      </div>
    </div>

  </div>

  <button class="arrow-btn">
  ➜
  </button>
</div>

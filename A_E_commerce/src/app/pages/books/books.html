<h2 style="text-align:center; margin:20px 0;">
   Book Categories
</h2>

<div class="book-container">

  <div class="book-card" *ngFor="let item of products">

    <div class="book-img-box">
      <img [src]="item.image" [alt]="item.name">
    </div>

    <div class="book-content">

      <h3>{{ item.name }}</h3>

      <p class="book-desc">
        {{ item.description }}
      </p>

      <div class="book-price-section">

        <span class="book-new-price">
          ₹{{ item.new_price }}
        </span>

        <span class="book-old-price">
          ₹{{ item.old_price }}
        </span>

      </div>

    </div>

  </div>

</div>
